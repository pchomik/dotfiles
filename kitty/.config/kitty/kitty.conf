# kitty — Ghostty parity config (generated)
# Font: same family & size as Ghostty. NOTE: kitty does no ligature/HarfBuzz
# shaping; DarkPrism's baked letter variants live in cmap so they render as designed.
font_family      DarkPrism
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
term             xterm-256color

# GitHub Dark (exact resolved values from `ghostty +show-config`)
background            #101216
foreground            #8b949e
cursor                #8b949e
cursor_text_color     #101216
selection_foreground  #ffffff
selection_background  #3b5070
color0  #000000
color1  #f78166
color2  #56d364
color3  #e3b341
color4  #6ca4f8
color5  #db61a2
color6  #2b7489
color7  #ffffff
color8  #4d4d4d
color9  #f78166
color10 #56d364
color11 #e3b341
color12 #6ca4f8
color13 #db61a2
color14 #2b7489
color15 #ffffff

# Window/behavior parity
background_opacity      1.0
resize_notification_time 0
enable_audio_bell       no
enabled_layouts         splits

# Keybinds: same as Ghostty (ctrl+w closes; ctrl+alt+arrows switch tabs)
map ctrl+w        close_tab
map ctrl+alt+right next_tab
map ctrl+alt+left  previous_tab

# Splits (tmux-like): shift+alt+\ horizontal (new pane below), shift+alt+- vertical (new pane right)
map shift+alt+backslash launch --location=vsplit --cwd=current
map shift+alt+minus     launch --location=hsplit --cwd=current

# Focus between splits with shift+alt+arrows
map shift+alt+up        neighboring_window up
map shift+alt+down      neighboring_window down
map shift+alt+left      neighboring_window left
map shift+alt+right     neighboring_window right

# tab bar: subtle, top, matching dark background
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# window padding
window_padding_width 10

linux_display_server x11
